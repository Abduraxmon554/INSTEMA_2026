databases:
  - name: masterclass-db
    databaseName: masterclass
    user: masterclass_user
    plan: free

services:
  - type: web
    name: masterclass-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: masterclass-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
